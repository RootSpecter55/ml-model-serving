services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ml
    ports:
      - '${POSTGRES_HOST_PORT:-5444}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d ml']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # MLflow tracking server: runs, metrics and model artifacts. UI at http://localhost:5001
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5001,127.0.0.1:5001
    ports:
      - '${MLFLOW_HOST_PORT:-5001}:5000'
    volumes:
      - mlflow:/mlflow

  # One-off job: applies migrations, then exits.
  migrate:
    build: .
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ml
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ml
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SECRETS_SOURCE: local
    ports:
      - '${API_HOST_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_started

volumes:
  pgdata:
  mlflow:
